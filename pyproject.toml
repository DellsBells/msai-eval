[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msai-eval"
version = "0.8.0"
description = "MSAI — Measurement System Analysis for Intelligence. Gage R&R for LLM-as-judge evals: measure your measurement system, not your model."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jake Makobi Waters" }]
keywords = ["llm", "evaluation", "llm-as-judge", "reliability", "gage-rr", "msa", "metrology", "inter-rater", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
dev = ["pytest>=7"]
bench = ["requests>=2.28", "datasets>=2.14"]

[project.urls]
Homepage = "https://github.com/msai-eval/msai-eval"

[tool.setuptools.packages.find]
where = ["src"]
